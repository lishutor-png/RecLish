name: Build RecLish Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: android
      KEY_PASSWORD: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            mkdir -p "$SDK_ROOT" 2>/dev/null || sudo mkdir -p "$SDK_ROOT"
          fi
          if [ ! -w "$SDK_ROOT" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT" || true
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"

          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDK_MANAGER" ] || [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -n "$SDK_MANAGER" ] && [ -x "$SDK_MANAGER" ]; then
            echo "Using sdkmanager at: $SDK_MANAGER"
            { yes || true; } | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" \
              || "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
              || true
          fi

          if [ ! -f "$SDK_ROOT/licenses/android-sdk-license" ]; then
            printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK_ROOT/licenses/android-sdk-license"
          fi
          if [ ! -f "$SDK_ROOT/licenses/android-sdk-preview-license" ]; then
            printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$SDK_ROOT/licenses/android-sdk-preview-license"
          fi

      - name: Cache Robolectric & Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-m2-robolectric-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystores and Environment
        run: |
          # 1. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

          # 2. Ensure valid debug.keystore exists
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || rm -f debug.keystore
            fi
          fi
          if [ ! -f "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

          # 3. Ensure valid my-upload-key.jks with alias 'upload' exists for release packaging
          if [ ! -f "my-upload-key.jks" ] || ! keytool -list -keystore my-upload-key.jks -alias upload -storepass android >/dev/null 2>&1; then
            rm -f my-upload-key.jks
            keytool -genkeypair -alias upload -keypass android -keystore my-upload-key.jks -storepass android -dname "CN=RecLish,O=RecLish,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Unit Test Reports (on Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build RecLish APK
        run: |
          ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

          mkdir -p release-apks
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 2 -name '*.apk' | head -n 1)"
          echo "Found Release APK: $RELEASE_APK"
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" release-apks/RecLish.apk
          ls -lh release-apks/RecLish.apk

      - name: Upload RecLish APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecLish-apk
          path: release-apks/RecLish.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="latest"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "RecLish APK ($TAG_NAME)" \
              --notes "Unduh langsung file **RecLish.apk** di bagian Assets (buka di browser Chrome/Edge jika memakai HP)."
            gh release upload "$TAG_NAME" release-apks/RecLish.apk --clobber
          else
            gh release create "$TAG_NAME" release-apks/RecLish.apk \
              --target "$GITHUB_SHA" \
              --title "RecLish APK ($TAG_NAME)" \
              --notes "Unduh langsung file **RecLish.apk** di bagian Assets (buka di browser Chrome/Edge jika memakai HP)."
          fi

          DIRECT_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG_NAME}/RecLish.apk"
          {
            echo "### RecLish.apk Siap Diunduh"
            echo ""
            echo "1. **Link Unduh Langsung (.apk tanpa ZIP):**"
            echo "   ${DIRECT_URL}"
            echo "2. **Halaman Releases:**"
            echo "   ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo ""
            echo "> Tips HP: Klik nama file **RecLish.apk** (bukan ikon salin \`sha256:\`), dan buka di browser Chrome jika muncul kendala di aplikasi/webview."
          } >> "$GITHUB_STEP_SUMMARY"
